name: Release

# Publishes message-cp to npm when the owner pushes a version tag, then its
# listing (server.json) to the official MCP Registry. npm trusts this workflow,
# by its file name, through trusted publishing, and the registry accepts the
# same job's GitHub OIDC token, so no token is stored anywhere. See "Releasing"
# in CONTRIBUTING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm and the MCP Registry
    runs-on: ubuntu-latest
    env:
      # Pinned: change it deliberately to a release of modelcontextprotocol/registry, never to "latest".
      MCP_PUBLISHER_VERSION: v1.8.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All history, so the tag check can tell whether the commit is on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # Never use a cache in a release build.
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.1
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          MAIN: main
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match package.json, whose version is $version: push the tag v$version, or bump version on main first."
            exit 1
          fi
          git fetch --no-tags --quiet origin "+refs/heads/$MAIN:refs/remotes/origin/$MAIN"
          if ! git merge-base --is-ancestor "$SHA" "origin/$MAIN"; then
            echo "::error::The tag $TAG points at $SHA, which is not on $MAIN: tag a commit on $MAIN."
            exit 1
          fi
          echo "Publishing message-cp $version from $SHA on $MAIN."
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      # A re-run of a release whose npm publish succeeded skips it: npm refuses a version twice.
      - name: Check whether npm has this version
        id: npm
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$(npm view --prefer-online "message-cp@$version" version 2>/dev/null)" = "$version" ]; then
            echo "npm already has message-cp $version, so this run skips npm publish and carries on to the MCP Registry."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance
      # npm can take a minute or more to serve a version it has just accepted, and the registry
      # refuses a listing whose npm version it cannot fetch, so wait for it, at most WAIT_SECONDS.
      - name: Wait for npm to serve this version
        env:
          WAIT_SECONDS: 600
        run: |
          version=$(node -p 'require("./package.json").version')
          deadline=$((SECONDS + WAIT_SECONDS))
          until [ "$(npm view --prefer-online "message-cp@$version" version 2>/dev/null)" = "$version" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::npm still does not serve message-cp $version after $WAIT_SECONDS seconds, so the MCP Registry would refuse the listing. Once https://www.npmjs.com/package/message-cp/v/$version shows it, re-run this job: it skips npm publish and publishes the listing."
              exit 1
            fi
            sleep 10
          done
          echo "npm serves message-cp $version."
      # The registry checks mcpName in the package just published, so these steps run only after it.
      # test/settings.test.ts fails unless server.json has package.json's name and version.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
