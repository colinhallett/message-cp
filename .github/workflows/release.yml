name: Release

# Publishes message-cp to npm when the owner pushes a version tag, then its
# listing (server.json) to the official MCP Registry. npm trusts this workflow,
# by its file name, through trusted publishing, and the registry accepts the
# same job's GitHub OIDC token, so no token is stored anywhere. The owner can
# also start it by hand for a tag that already exists, to finish a release with
# the workflow as it is on main. See "Releasing" in CONTRIBUTING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The version tag to release again, such as v0.1.1"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm and the MCP Registry
    runs-on: ubuntu-latest
    env:
      # The tag this run releases: the input of a run started by hand, else the pushed tag.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      # Pinned: change it deliberately to a release of modelcontextprotocol/registry, never to "latest".
      MCP_PUBLISHER_VERSION: v1.8.6
    steps:
      # A run started by hand checks out the tag it names, so this refuses it before anything is checked out.
      - name: Check who started the run and the tag it names
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: colinhallett
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ]; then
            echo "::error::Only $OWNER can start a release by hand; this run was started by $TRIGGERING_ACTOR."
            exit 1
          fi
          if ! git check-ref-format "refs/tags/$TAG" || ! git ls-remote --exit-code --tags "$REPOSITORY_URL" "refs/tags/$TAG" > /dev/null; then
            echo "::error::There is no tag $TAG: give the name of a version tag that exists, such as v1.2.3."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag a run started by hand names, never main; a pushed tag's own commit otherwise.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}
          # All history, so the tag check can tell whether the commit is on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # Never use a cache in a release build.
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.1
      - name: Check the tag
        env:
          MAIN: main
        run: |
          # The checked-out commit: the pushed tag's, or the one the tag named by hand points at.
          SHA=$(git rev-parse HEAD)
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match package.json, whose version is $version: push the tag v$version, or bump version on main first."
            exit 1
          fi
          git fetch --no-tags --quiet origin "+refs/heads/$MAIN:refs/remotes/origin/$MAIN"
          if ! git merge-base --is-ancestor "$SHA" "origin/$MAIN"; then
            echo "::error::The tag $TAG points at $SHA, which is not on $MAIN: tag a commit on $MAIN."
            exit 1
          fi
          echo "Publishing message-cp $version from $SHA on $MAIN."
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      # A re-run, or a run started by hand, for a release whose npm publish succeeded skips it: npm refuses a version twice.
      - name: Check whether npm has this version
        id: npm
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$(npm view --prefer-online "message-cp@$version" version 2>/dev/null)" = "$version" ]; then
            echo "npm already has message-cp $version, so this run skips npm publish and carries on to the MCP Registry."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance
      # npm can take a minute or more to serve a version it has just accepted, and the registry
      # refuses a listing whose npm version it cannot fetch, so wait for it, at most WAIT_SECONDS.
      - name: Wait for npm to serve this version
        # A hard limit too, in case one npm view hangs past the deadline.
        timeout-minutes: 12
        env:
          WAIT_SECONDS: 600
        run: |
          version=$(node -p 'require("./package.json").version')
          deadline=$((SECONDS + WAIT_SECONDS))
          until [ "$(npm view --prefer-online "message-cp@$version" version 2>/dev/null)" = "$version" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::npm still does not serve message-cp $version after $WAIT_SECONDS seconds, so the MCP Registry would refuse the listing. Once https://www.npmjs.com/package/message-cp/v/$version shows it, re-run this job, or start Release by hand for $TAG: it skips npm publish and publishes the listing."
              exit 1
            fi
            sleep 10
          done
          echo "npm serves message-cp $version."
      # The registry checks mcpName in the package on npm, so these steps run only after it is there.
      # test/settings.test.ts fails unless server.json has package.json's name and version.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
